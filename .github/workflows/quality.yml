          npm run test:local-practice-review-queue
          npm run test:local-weak-point-review-queue
          npm run test:local-explainable-practice-recommendation
          npm run test:local-learning-overview
          npm run test:mobile-practice-review-storage
          npm run test:mobile-practice-review-ui-contract
          npm run test:mobile-practice-review-behavior
          npm run test:mobile-weak-point-review-behavior
          npm run test:mobile-explainable-practice-recommendation-behavior
          npm run test:mobile-learning-overview-behavior
          npm run test:learning-event-profile
          npm run test:mobile-learning-profile-storage
          npm run test:local-practice-statistics
          npm run test:mobile-practice-statistics-behavior
          npm run test:local-course-path
          npm run test:mobile-course-path-behavior
          npm run test:mobile-melody-solfege-behavior
          npm run test:mobile-melody-imitation-behavior
          npm run test:mobile-melody-sight-singing-target
          npm run test:mobile-melody-sight-singing-behavior
          npm run test:mobile-piano-behavior
          npm run test:piano-audio-foundation
          npm run test:piano-interaction
          npm run test:piano-performance
          npm run test:piano-midi
          npm run test:piano-learning-score
          npm run test:android-local-artifact-verifier
          npm run test:android-version
          npm run test:quality-workflow-test-coverage
          npm run test:android-p104-evidence
          npm run test:pitch-benchmark-protocol
          npm run test:p119-content-education-evidence
          npm run test:p119-content-review-manifest
          npm run verify:p119-content-review-manifest -- --manifest local-fixtures/p119-content-education/review-manifest.bd5c5af211a3a1b36f4fcfacebdfe89b65fbafc1.json
          npm run test:p119-teacher-review-candidate
          npm run test:offline-pitch-analysis
          npm run test:offline-note-alignment
          npm run test:activity-protocol
          npm run test:musical-time-v1
          npm run test:note-event-v1
          npm run test:android-midi-bridge
          npm run test:android-usb-midi-activity-adapter
          npm run test:piano-note-event-activity-adapter
          npm run test:notation-rhythm-activity-adapter
          npm run test:notation-document-activity
          npm run test:notation-document-activity-behavior
          npm run test:shared-project-capability
          npm run test:piano-learning-activity-adapter
          npm run test:melody-solfege-activity-adapter
          npm run test:melody-piano-activity-adapter
          npm run test:melody-staff-notation-activity-adapter
          npm run test:melody-numbered-notation-activity-adapter
          npm run test:local-melody-imitation
          npm run test:melody-imitation-activity-adapter
          npm run test:local-melody-sight-singing
          npm run test:melody-sight-singing-activity-adapter
          npm run test:legacy-activity-adapters
          npm run test:analysis-evidence-adapter
          npm run test:local-vocal-microphone-activity-adapter
          npm run test:companion-activity-bridge
          npm run test:local-question-scheduler
          npm run test:local-practice-catalog
          npm run test:local-practice-customizer
          npm run test:expanded-local-practice-catalog
          npm run test:realtime-pitch-frame
          npm run test:realtime-pitch-curve
          npm run test:local-vocal-exercise
          npm run test:mobile-vocal-exercise-behavior
          npm run test:local-vocal-exercise-ui-contract
          npm run test:local-vocal-target-feedback
          npm run test:local-vocal-practice-record
          npm run test:local-vocal-practice-indexeddb
          npm run test:local-vocal-practice-storage-ui-contract
          npm run test:local-vocal-observation
          npm run test:local-vocal-observation-ui-contract
          npm run test:mobile-vocal-observation-behavior
          npm run test:realtime-pitch-monitor-ui-contract
          npm run test:realtime-pitch-monitor-behavior
          npm run test:mobile-interval-imitation-behavior
          npm run test:local-ear-training-single-pitch
          npm run test:local-ear-training-intervals
          npm run test:local-interval-comparisons
          npm run test:local-ear-training-chords
          npm run test:local-seventh-chords
          npm run test:local-seventh-chord-spacing
          npm run test:local-modulations
          npm run test:local-harmony-progressions
          npm run test:local-scale-modes
