          npm run test:local-rhythm-sight-reading
          npm run test:mobile-rhythm-sight-reading-behavior
          npm run test:local-rhythm-imitation
          npm run test:mobile-rhythm-imitation-behavior
          npm run test:local-rhythm-error-finding
          npm run test:mobile-rhythm-error-finding-behavior
          npm run test:local-rhythm-dictation
          npm run test:mobile-rhythm-dictation-behavior
          npm run test:local-ear-training-melody-dictation
          npm run test:local-piano-keyboard
          npm run test:cloud-practice-attempt
          npm run test:local-melody-guide-validator
          npm run test:local-melody-guide-wav-header-inspector
          npm run test:metronome-foundation
          npm run test:rhythm-tap-feedback
          npm run test:rhythm-latency-calibration
          npm run test:audio-onset-rhythm-feedback
          npm run test:audio-onset-detection
          npm run test:local-melody-guide-audio-import
          npm run test:local-target-pitch-curve-draft
          npm run test:local-target-pitch-curve-review
          npm run test:local-target-pitch-curve-draft-review-controls
          npm run test:local-reviewed-draft-practice-target
          npm run test:local-sheet-music-import-source
          npm run test:local-mock-recognition-draft
          npm run test:local-notation-fragment-draft
          npm run test:local-notation-draft-validation
          npm run test:local-notation-draft-practice-target
          npm run test:non-scoring-notation-target-pitch-feedback
          npm run test:notation-temporary-rhythm-tap
          npm run test:practice-module-registry
          npm run test:note-frequency
          npm run test:recognition-fail-closed
          npm run test:recognition-workflow-controller
          npm run test:recognition-static-boundaries
          npm run test:auth-ui-policy
          npm run test:account-password-auth
          npm run test:account-data-export
          npm run test:account-data-export-ui-contract
          npm run test:account-session-stale-guard
          npm run test:web-private-practice-history
          npm run test:course-library-behavior
          npm run test:notation-temporary-practice-progress
          npm run test:notation-reference-melody-playback
          npm run test:repository-hygiene
          npm run test:local-score-project
          npm run test:local-score-project-templates
          npm run test:local-score-project-score-credits
          npm run test:local-score-project-note-fingering
          npm run test:local-score-project-chord-symbol
          npm run test:local-score-project-note-articulations
          npm run test:local-score-project-dynamic-mark
          npm run test:local-score-project-damper-pedal
          npm run test:local-score-project-fermata
          npm run test:local-score-project-slur
          npm run test:local-score-project-musicxml-import
          npm run test:local-score-project-musicxml-export
          npm run test:local-score-project-recovery-candidate
          npm run test:local-score-project-storage
          npm run test:local-score-project-capacity
          npm run test:local-score-project-indexeddb-recovery
          npm run test:local-score-project-playback
          npm run test:mobile-local-score-project-playback-behavior
          npm run test:mobile-local-score-project-metronome-behavior
          npm run test:mobile-local-score-project-transport-behavior
          npm run test:mobile-local-score-project-behavior
          npm run test:mobile-local-score-project-staff-preview-behavior
          npm run test:mobile-local-score-project-numbered-preview-behavior

      - name: Validate final platform contracts
        if: ${{ needs.classify.outputs.run_code == 'true' }}
        run: npm run validate:final-platform-schema && npm run validate:database-least-privilege

      - name: Validate local Android bundle
        if: ${{ needs.classify.outputs.run_android == 'true' }}
        run: npm run validate:repository-hygiene && npm run validate:android-version && npm run android:sync && npm run validate:android-local

      - name: Build
        if: ${{ needs.classify.outputs.run_web == 'true' }}
        run: npm run build

  android_local:
    name: android-local
    needs: classify
    if: ${{ needs.classify.outputs.run_android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0
        with:
          cmdline-tools-version: "12266719"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate Android version provenance
        run: npm run validate:android-version

      - name: Build local Android debug APK
        run: npm run android:sync && npm run validate:android-local && cd android && ./gradlew testDebugUnitTest assembleDebug

      - name: Verify and package local Android debug APK
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/package-android-local-debug-artifact.mjs

      - name: Independently verify packaged Android debug artifact
        run: npm run verify:android-local-artifact

      - name: Upload verified local Android debug APK
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.upload_apk }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: solfeggio-local-debug-apk-${{ github.sha }}
          path: artifacts/android-local/
          if-no-files-found: error
          retention-days: 14

  quality:
    name: quality
    needs:
      - classify
      - quality_suite
      - android_local
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce required CI results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUALITY_SUITE_RESULT: ${{ needs.quality_suite.result }}
          ANDROID_RESULT: ${{ needs.android_local.result }}
          RUN_ANDROID: ${{ needs.classify.outputs.run_android }}
          CLASSIFICATION: ${{ needs.classify.outputs.classification }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Required quality gate"
            echo
            echo "- Classification: ${CLASSIFICATION:-unavailable}"
            echo "- classify: $CLASSIFY_RESULT"
            echo "- quality-suite: $QUALITY_SUITE_RESULT"
            echo "- android-local: $ANDROID_RESULT"
            echo "- Android required: ${RUN_ANDROID:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CLASSIFY_RESULT" != "success" ] || [ "$QUALITY_SUITE_RESULT" != "success" ]; then
            echo "::error::Required classify or quality-suite job did not succeed."
            exit 1
          fi

          if [ "$RUN_ANDROID" = "true" ] && [ "$ANDROID_RESULT" != "success" ]; then
            echo "::error::Android validation was required but did not succeed."
            exit 1
          fi

          if [ "$RUN_ANDROID" != "true" ] && [ "$ANDROID_RESULT" != "skipped" ]; then
            echo "::error::Android validation ran unexpectedly or returned an unknown result."
            exit 1
          fi
