name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Upload the verified private-test debug APK
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      run_code: ${{ steps.changes.outputs.run_code }}
      run_web: ${{ steps.changes.outputs.run_web }}
      run_android: ${{ steps.changes.outputs.run_android }}
      run_audit: ${{ steps.changes.outputs.run_audit }}
      full: ${{ steps.changes.outputs.full }}
      classification: ${{ steps.changes.outputs.classification }}
      runtime_shadow_full: ${{ steps.changes.outputs.runtime_shadow_full }}
      runtime_shadow_lanes: ${{ steps.changes.outputs.runtime_shadow_lanes }}
      runtime_shadow_reason: ${{ steps.changes.outputs.runtime_shadow_reason }}
      runtime_shadow_selected_commands: ${{ steps.changes.outputs.runtime_shadow_selected_commands }}
      runtime_shadow_total_commands: ${{ steps.changes.outputs.runtime_shadow_total_commands }}
      runtime_shadow_estimated_seconds: ${{ steps.changes.outputs.runtime_shadow_estimated_seconds }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Test CI change policy
        run: npm run test:ci-change-policy && npm run test:runtime-test-lane-policy

      - name: Classify changed paths
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-changes.mjs

  quality_suite:
    name: quality-suite
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate documentation hygiene
        run: npm run test:documentation-hygiene && npm run validate:documentation-hygiene && npm run test:ci-supply-chain-policy

      - name: Install dependencies
        if: ${{ needs.classify.outputs.run_code == 'true' }}
        run: npm ci

      - name: Audit production dependencies
        if: ${{ needs.classify.outputs.run_audit == 'true' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        if: ${{ needs.classify.outputs.run_code == 'true' }}
        run: npm run lint

      - name: Type check
        if: ${{ needs.classify.outputs.run_code == 'true' }}
        run: npm run typecheck

      - name: Mobile runtime tests
        if: ${{ needs.classify.outputs.run_code == 'true' }}
        run: |
          npm run test:accessibility-prefilter
          npm run test:browser-audio-engine
          npm run test:practice-target-playback-controller
          npm run test:blob-audio-playback
          npm run test:media-recorder-capture
          npm run test:practice-local-recording-controller
          npm run test:realtime-pitch-input
